name: Keep API awake

# Бесплатный тариф Render усыпляет сервис после 15 минут простоя,
# и первый запрос после сна ждёт пробуждения около минуты.
# Регулярный пинг health-эндпоинта не даёт сервису заснуть.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Пинг health-эндпоинта
        env:
          API_URL: ${{ vars.VITE_API_URL || 'https://novosti-sekundy-api.onrender.com/api' }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$API_URL/health")
          echo "GET $API_URL/health -> $code"
          # Разбудить сервис важнее, чем получить именно 200:
          # падать из-за одного неудачного пинга смысла нет.
          if [ "$code" != "200" ]; then
            echo "::warning::Health-эндпоинт ответил $code"
          fi
