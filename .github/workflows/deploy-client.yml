name: Deploy client to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/deploy-client.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - name: Сборка
        env:
          # Основной путь проходит через Cloudflare Worker: он устойчивее в
          # мобильных браузерах. Прямой туннель Raspberry Pi остаётся запасным.
          # Pages.dev is the primary route for DuckDuckGo on Android. The client
          # automatically retries through Worker and Tunnel if this route fails.
          VITE_API_URL: https://news-seconds-api-pages.pages.dev/api
          # Сайт живёт на своём домене (client/public/CNAME), то есть в корне.
          # Для подпапки /<имя-репозитория>/ здесь была бы другая строка.
          VITE_BASE_PATH: /
        run: npm run build

      - name: SPA-фолбэк для прямых ссылок
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
